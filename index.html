<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Palteca - Learn Korean Effectively</title>
    <meta name="description" content="Adaptive Korean learning platform using spaced repetition and retrieval practice">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇷</text></svg>">
</head>
<body>
    <!-- Navigation -->
    <nav id="main-nav">
        <div class="nav-container">
            <div class="logo">🇰🇷 Korean Palteca</div>
            <div class="nav-links">
                <a href="#" data-page="dashboard" class="active">📊 Dashboard</a>
                <a href="#" data-page="study">📚 Study</a>
                <a href="#" data-page="grammar">📖 Grammar</a>
                <a href="#" data-page="vocabulary">📝 Vocabulary</a>
                <a href="#" data-page="reading">📰 Reading</a>
                <a href="#" data-page="progress">📈 Progress</a>
            </div>
            <div class="user-info">
                <span id="level-badge">TOPIK 1</span>
                <span id="streak">🔥 0</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app">
        <div id="content-container">
            <!-- Content will be dynamically rendered here -->
        </div>
    </main>

    <!-- Modals -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>🇰🇷 Korean Palteca - Learn Korean with Spaced Repetition</p>
            <p><small>All content is for educational purposes</small></p>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
